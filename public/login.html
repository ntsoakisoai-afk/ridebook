<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ride Booking</title>

    <script>
        const storedUser = sessionStorage.getItem("user");
        const storedToken = sessionStorage.getItem("token");

        if (storedToken && storedUser) {
            try {
                const user = JSON.parse(storedUser);
                if (user.role === "driver") {
                    window.location.replace("driver.html");
                } else if (user.role === "admin") {
                    window.location.replace("admin.html");
                } else {
                    window.location.replace("index.html");
                }
            } catch (error) {
                sessionStorage.clear();
            }
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

<div class="auth-hero" aria-hidden="true">
    <div class="hero-glow"></div>
    <div class="hero-road"></div>
    <div class="car-animation">
        <div class="car-body">
            <div class="car-window"></div>
            <div class="car-light"></div>
        </div>
        <div class="car-wheel wheel-front"></div>
        <div class="car-wheel wheel-back"></div>
    </div>
</div>

<div class="auth-card">
    <div class="auth-brand">
        <div class="brand-mark">R</div>
        <div>
            <h2>RideBook</h2>
            <p>Your ride. Your journey.</p>
        </div>
    </div>

    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to continue your journey.</p>

    <form id="loginForm" class="auth-form">
        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit">Log in</button>
    </form>

    <p id="message"></p>

    <p class="auth-footer">
        Don't have an account?
        <a href="register.html">Create an account</a>
    </p>

</div>

<script src="toast.js"></script>
<script src="login.js"></script>

</body>
</html>
