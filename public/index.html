<!DOCTYPE html>
<html lang="en">
  <head>

    <script>
      const storedUser = sessionStorage.getItem("user");
      const storedToken = sessionStorage.getItem("token");

      if (!storedToken || !storedUser) {
        window.location.replace("login.html");
      }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideBook - Request a Ride</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
    <link rel="stylesheet" href="style.css">

  </head>
  
  <body>
    <div id="app">

      <div id="sidebar">

        <h1>RideBook</h1>

        <div id="user-panel">

          <div class="user-avatar">👤</div>

          <h3 id="welcome-user">Welcome, </h3>

          <span class="user-role">Rider</span>

          <div class="user-buttons">

            <button id="profile-btn">My Profile</button>
            <button id="logout-btn">Logout</button>
          </div>

        </div>

        <div class="instruction-card">
          <p class="instruction" id="instruction">Click the map to set your pickup location</p>
        </div>

        <div id="ride-controls" class="hidden">

          <button id="request-btn">Request Ride</button>
          <button id="reset-btn">Reset</button>

        </div>
        <h2>My Rides</h2>
        <p class="ride-subtitle">View all your past and upcoming rides</p>

        <ul id="rides-list"></ul>

      </div>

      <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
    <script src="toast.js"></script>
    <script src="app.js"></script>
    
  </body>
</html>
