<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Ride Booking</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-hero" aria-hidden="true">
        <div class="hero-glow"></div>
        <div class="hero-road"></div>
        <div class="car-animation">
            <div class="car-body">
                <div class="car-window"></div>
                <div class="car-light"></div>
            </div>
            <div class="car-wheel wheel-front"></div>
            <div class="car-wheel wheel-back"></div>
        </div>
    </div>

    <div class="auth-card auth-card-wide">
        <div class="auth-brand">
            <div class="brand-mark">R</div>
            <div>
                <h2>RideBook</h2>
                <p>Your ride. Your journey.</p>
            </div>
        </div>

        <h1>Create your RideBook account</h1>
        <p class="auth-subtitle">Start your journey with RideBook.</p>

        <form id="registerForm" class="auth-form auth-form-grid">
            <div class="form-group">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" placeholder="Enter your first name" autocomplete="given-name" required>
            </div>

            <div class="form-group">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" placeholder="Enter your last name" autocomplete="family-name" required>
            </div>

            <div class="form-group full-width">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
            </div>

            <div class="form-group full-width">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" autocomplete="tel">
            </div>

            <div class="form-group full-width">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" required>
            </div>

            <div class="form-group full-width">
                <label for="role">I am a: </label>
                <select id="role">
                    <option value="rider">Passenger</option>
                    <option value="driver">Driver</option>
                </select>
            </div>

            <button type="submit" class="full-width">Create account</button>
        </form>

        <p id="message"></p>

        <p class="auth-footer">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>

    </div>

    <script src="toast.js"></script>
    <script src="register.js"></script>

</body>
</html>
