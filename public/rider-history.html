<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Protect the page -->
  <script>
    const storedUser = sessionStorage.getItem("user");
    const storedToken = sessionStorage.getItem("token");

    if (!storedToken || !storedUser) {
      window.location.replace("login.html");
    }
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RideBook - Ride History</title>

  <link rel="stylesheet" href="style.css">

</head>

<body class="rider-history-page">

  <div class="rider-history-layout">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="rider-history-sidebar">

      <!-- BRAND -->

      <div class="rider-history-brand">
        <h1>RideBook</h1>
      </div>


      <!-- USER CARD -->

      <div class="rider-history-user">

        <div class="rider-history-avatar">
          👤
        </div>

        <h3 id="riderName">
          Welcome
        </h3>

        <span class="rider-role">
          RIDER
        </span>

      </div>


      <!-- NAVIGATION -->

      <nav class="rider-history-nav">

        <button
          type="button"
          onclick="window.location.href='index.html'"
        >
          🚗
          <span>Request a Ride</span>
        </button>


        <button
          type="button"
          onclick="window.location.href='profile.html'"
        >
          👤
          <span>My Profile</span>
        </button>


        <button
          type="button"
          class="active"
          onclick="window.location.href='rider-history.html'"
        >
          📜
          <span>Ride History</span>
        </button>

      </nav>


      <!-- DIVIDER -->

      <div class="rider-history-divider"></div>


      <!-- LOGOUT -->

      <button
        type="button"
        id="logout-btn"
        class="logout-btn"
      >
        🚪
        <span>Logout</span>
      </button>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="rider-history-content">

      <!-- HEADER SECTION -->

      <header class="history-header">

        <div class="history-title">

          <h1>Ride History</h1>

          <p>View all completed, cancelled and upcoming rides</p>

        </div>

      </header>


      <!-- STATISTICS CARDS -->

      <section class="history-stats">

        <div class="stat-card">
          <div class="stat-label">Total Rides</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Completed</div>
          <div class="stat-value stat-completed" id="stat-completed">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Cancelled</div>
          <div class="stat-value stat-cancelled" id="stat-cancelled">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Upcoming</div>
          <div class="stat-value stat-upcoming" id="stat-upcoming">0</div>
        </div>

      </section>


      <!-- FILTERS SECTION -->

      <div class="history-controls">

        <div class="filter-group">

          <div class="filter-buttons">

            <button type="button" class="filter-btn active" data-filter="all">
              All Rides
            </button>

            <button type="button" class="filter-btn" data-filter="completed">
              ✓ Completed
            </button>

            <button type="button" class="filter-btn" data-filter="cancelled">
              ✕ Cancelled
            </button>

            <button type="button" class="filter-btn" data-filter="accepted">
              📍 Upcoming
            </button>

          </div>

        </div>

        <div class="search-group">

          <input 
            type="text" 
            id="search-rides" 
            class="search-input" 
            placeholder="Search by location or driver..."
            aria-label="Search rides"
          >

        </div>

      </div>


      <!-- HIDDEN FALLBACK SELECT (for compatibility) -->

      <select id="history-filter" style="display: none;">

        <option value="all">All Rides</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
        <option value="accepted">Upcoming</option>

      </select>


      <!-- =========================
           RIDE HISTORY LIST
      ========================== -->

      <section
        id="history-rides"
        class="rider-history-list"
      >

        <div class="history-loading">
          Loading your rides...
        </div>

      </section>

    </main>

  </div>


  <!-- SCRIPTS -->

  <script src="toast.js"></script>
  <script src="rider-history.js"></script>

</body>

</html>
