<!DOCTYPE html>
<html lang="en">
<head>
<script>
    const storedUser = sessionStorage.getItem("user");
    const storedToken = sessionStorage.getItem("token");

    if (!storedToken || !storedUser) {
        window.location.replace("login.html");
    }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ride History</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="driver-page">

<div class="driver-layout">

    <aside class="driver-sidebar">

        <h2>RideBook</h2>

        <div class="driver-user">

            <div class="avatar">👤</div>

            <h3 id="driverName"></h3>

            <span class="online">🟢 Online</span>

        </div>

        <nav>

            <button onclick="window.location.href='driver.html'">
                🚖 Dashboard
            </button>

            <button onclick="window.location.href='profile.html'">
                👤 My Profile
            </button>

            <button class="active" onclick="window.location.href='history.html'">
                📜 Ride History
            </button>

            <button class="logout-btn"
                onclick="sessionStorage.clear();localStorage.clear();window.location.href='login.html'">
                🚪 Logout
            </button>

        </nav>

    </aside>

    <main class="driver-content">

        <h1>Driver History</h1>

        <p>View your completed rides and earnings.</p>

        <!-- ========================== -->
        <!-- STATISTICS SUMMARY -->
        <!-- ========================== -->
        <div id="history-stats"></div>

        <!-- ========================== -->
        <!-- FILTERS -->
        <!-- ========================== -->
        <div class="history-filters">
            <div class="filter-group">
                <label for="history-filter">Status</label>
                <select id="history-filter">
                    <option value="all">All Rides</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="accepted">Accepted</option>
                    <option value="in_progress">In Progress</option>
                </select>
            </div>

            <div class="filter-group date-filters" id="date-filters">
                <label>Date</label>
                <div class="date-filter-buttons">
                    <button class="date-filter-btn active" data-filter="all">All Time</button>
                    <button class="date-filter-btn" data-filter="today">Today</button>
                    <button class="date-filter-btn" data-filter="week">This Week</button>
                    <button class="date-filter-btn" data-filter="month">This Month</button>
                </div>
            </div>
        </div>

        <!-- ========================== -->
        <!-- RIDE COUNT -->
        <!-- ========================== -->
        <div class="history-summary">
            <span id="ride-count">0 rides</span>
        </div>

        <!-- ========================== -->
        <!-- HISTORY LIST -->
        <!-- ========================== -->
        <div id="history-rides"></div>

    </main>

</div>

<script src="toast.js"></script>
<script src="history.js"></script>

</body>
</html>
